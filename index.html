<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Astore-9 - Black Box Terminal</title>
    <style>
        :root {
            --theme-color: #0f0; 
            --bg-color: #000;
        }

        * {
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--theme-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
        }

        .container {
            width: 90%;
            max-width: 1200px; 
            height: 90%;
            border: 2px solid var(--theme-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: border-color 0.5s, color 0.5s;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .active {
            display: flex;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
            border-bottom: 1px solid var(--theme-color);
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
            transition: border-color 0.5s;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 80%;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .data-item {
            margin: 10px 0;
        }

        #login-message {
            height: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input[type="password"] {
            background-color: var(--bg-color);
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            font-family: inherit;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            width: 50%;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.5s, color 0.5s;
        }

        input[type="password"]:disabled {
            opacity: 0.5;
        }

        button {
            background-color: var(--theme-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            transition: background-color 0.5s, color 0.5s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #fff;
            color: #000;
        }

        #log-screen {
            justify-content: flex-start;
            overflow-y: hidden;
        }

        .log-content {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            text-align: left;
            padding-left: 10px;
            line-height: 1.4;
        }

        .progress-wrapper {
            width: 100%;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 20px;
            border: 1px solid var(--theme-color);
            position: relative;
            background-color: #111;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--theme-color);
            width: 0%;
        }

        .progress-text {
            min-width: 50px;
            font-weight: bold;
            text-align: right;
        }

        .countdown-text {
            min-width: 70px;
            font-weight: bold;
            text-align: left;
            color: #fff;
        }

        #end-code {
            font-size: 1.8rem; /* Font rimpicciolito per far stare la coordinata */
            letter-spacing: 3px; /* Spaziatura ridotta */
            margin: 20px 0;
            color: #fff;
            text-align: center;
        }

        #timer {
            font-size: 1.2rem;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen" class="screen active">
            <h1>Astore-9 Terminal</h1>
            <div class="data-grid">
                <div class="data-item">SYS: ONLINE</div>
                <div class="data-item">LOC: [LOCKED]</div>
                <div class="data-item">ALT: 0.0M</div>
                <div class="data-item">BAT: 85%</div>
            </div>
            <div id="login-message"></div>
            <input type="password" id="password-input" placeholder="ENTER KEY" autocomplete="off">
            <button id="login-btn" onclick="checkPassword()">Access</button>
        </div>

        <div id="log-screen" class="screen">
            <h1>Data Download in Progress</h1>
            <div id="log-text" class="log-content"></div>
            <div class="progress-wrapper">
                <div id="progress-text" class="progress-text">0%</div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div id="countdown-text" class="countdown-text">30:00</div>
            </div>
        </div>

        <div id="final-screen" class="screen">
            <h1>Download Complete</h1>
            <div>Target Coordinates:</div>
            <div id="end-code"></div>
            <div id="timer"></div>
        </div>
    </div>

    <script>
        const PASS1 = "234051"; // Password per tema Rosso
        const PASS2 = "224589"; // Password per tema Blu

        let failedAttempts = 0;
        let isLocked = false;
        
        let mainInterval;
        let logActive = false;
        let finalCoordinate = ""; // Variabile per salvare la coordinata finale

        // Frasi di log per il download
        const logPhrases = [
            "Initializing handshake protocol",
            "Bypassing firewall node A7",
            "Decrypting RSA-4096 keys",
            "Extracting telemetry data",
            "Analyzing flight path logs",
            "Compiling visual feed",
            "Overriding root access",
            "Downloading encrypted payload",
            "Syncing offshore backup",
            "Establishing secure tunnel",
            "Pinging remote server",
            "Verifying data integrity",
            "Parsing packet headers",
            "Decompressing archives",
            "Scanning for malware signatures",
            "Mounting virtual drive",
            "Retrieving GPS coordinates",
            "Accessing black box memory",
            "Bypassing biometric lock",
            "Routing through proxy servers",
            "Extracting core protocols",
            "Injecting surveillance scripts",
            "Rebuilding corrupted sectors",
            "Cross-referencing satellite uplink",
            "Calibrating sensor array",
            "Authenticating clearance level",
            "Spoofing network signature",
            "Reconstructing audio fragments",
            "Indexing encrypted archives",
            "Triangulating signal origin",
            "Purging temporary cache",
            "Validating checksum tables",
            "Deploying countermeasure protocol",
            "Rerouting power to core systems",
            "Fetching diagnostic subroutines",
            "Compressing telemetry stream",
            "Unlocking hidden partition",
            "Cloning secure volume",
            "Analyzing thermal signatures",
            "Synchronizing internal clock",
            "Resolving DNS anomalies",
            "Interfacing with legacy hardware",
            "Neutralizing tracking beacon",
            "Verifying digital signatures",
            "Loading classified schematics",
            "Assembling fragmented packets"
        ];

        function checkPassword() {
            if (isLocked) return;
            
            const pass = document.getElementById('password-input').value.trim();
            const msgDiv = document.getElementById('login-message');

            if (pass === PASS1 || pass === PASS2) {
                // Successo
                msgDiv.style.color = "var(--theme-color)";
                msgDiv.innerText = "ACCESS GRANTED";
                
                // Cambia il colore dell'interfaccia e imposta la coordinata
                if (pass === PASS1) {
                    document.documentElement.style.setProperty('--theme-color', '#ff0000'); // Rosso
                    finalCoordinate = "POSIZIONE HQ BLU: settore C-2";
                } else {
                    document.documentElement.style.setProperty('--theme-color', '#00aaff'); // Blu hi-tech
                    finalCoordinate = "POSIZIONE HQ ROSSO: settore G-6";
                }

                // Disabilita l'input durante il passaggio di schermata
                document.getElementById('password-input').disabled = true;
                document.getElementById('login-btn').disabled = true;

                // Breve pausa per far leggere "Access Granted", poi parte il download
                setTimeout(() => {
                    startLog();
                }, 1500);

            } else {
                // Errore
                failedAttempts++;
                msgDiv.style.color = "#ff0000"; // Rosso per l'errore indipendentemente dal tema
                msgDiv.innerText = "ACCESS DENIED - INVALID KEY";
                document.getElementById('password-input').value = "";
                
                if (failedAttempts >= 3) {
                    lockout();
                }
            }
        }

        function lockout() {
            isLocked = true;
            let timeLeft = 30; // 30 secondi di blocco
            const msgDiv = document.getElementById('login-message');
            const inputField = document.getElementById('password-input');
            const btn = document.getElementById('login-btn');
            
            inputField.disabled = true;
            btn.disabled = true;

            let lockInterval = setInterval(() => {
                msgDiv.innerText = `SYSTEM LOCKED. RETRY IN ${timeLeft}s`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(lockInterval);
                    isLocked = false;
                    failedAttempts = 0;
                    inputField.disabled = false;
                    btn.disabled = false;
                    msgDiv.innerText = "";
                    msgDiv.style.color = "var(--theme-color)";
                }
            }, 1000);
        }

        function formatMMSS(totalSeconds) {
            const s = Math.max(0, Math.round(totalSeconds));
            const minutes = Math.floor(s / 60);
            const seconds = s % 60;
            return `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function startLog() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('log-screen').classList.add('active');
            
            logActive = true;
            const logText = document.getElementById('log-text');
            logText.innerHTML = ""; // Pulisce i log
            
            // Variabili per il progresso principale (30 minuti)
            const totalDuration = 30 * 60 * 1000; 
            const updateInterval = 1000; 
            const increment = (updateInterval / totalDuration) * 100;
            let mainProgress = 0;
            let remainingMs = totalDuration;

            document.getElementById('countdown-text').innerText = formatMMSS(remainingMs / 1000);

            // Avvia la barra principale
            mainInterval = setInterval(() => {
                mainProgress += increment;
                if (mainProgress > 100) mainProgress = 100;

                remainingMs -= updateInterval;
                if (remainingMs < 0) remainingMs = 0;
                
                document.getElementById('progress-fill').style.width = mainProgress + '%';
                document.getElementById('progress-text').innerText = Math.floor(mainProgress) + '%';
                document.getElementById('countdown-text').innerText = formatMMSS(remainingMs / 1000);

                if (mainProgress >= 100) {
                    clearInterval(mainInterval);
                    logActive = false; // Ferma il flusso dei log
                    setTimeout(showFinalScreen, 1000); // Pausa di 1s al 100% prima della schermata finale
                }
            }, updateInterval);

            // Avvia la generazione dinamica dei log
            generateDynamicLog();
        }

        // Funzione ricorsiva per generare righe di log con percentuale individuale
        function generateDynamicLog() {
            if (!logActive) return;

            const logTextDiv = document.getElementById('log-text');
            const phrase = logPhrases[Math.floor(Math.random() * logPhrases.length)];
            
            // Crea un contenitore per la singola riga
            let lineDiv = document.createElement('div');
            logTextDiv.appendChild(lineDiv);
            
            let localProgress = 0;
            
            // Intervallo per la percentuale della singola riga (molto veloce)
            let lineInterval = setInterval(() => {
                localProgress += Math.floor(Math.random() * 25 + 10); // Avanza a salti casuali del 10-35%
                if (localProgress >= 100) localProgress = 100;
                
                lineDiv.innerText = `> ${phrase}... [${localProgress}%]`;
                logTextDiv.scrollTop = logTextDiv.scrollHeight; // Auto-scroll verso il basso

                if (localProgress === 100) {
                    clearInterval(lineInterval);
                    lineDiv.innerText = `> ${phrase}... [OK]`;
                    
                    // Lancia la riga successiva dopo una piccolissima pausa (50-250ms)
                    if (logActive) {
                        setTimeout(generateDynamicLog, Math.floor(Math.random() * 200 + 50));
                    }
                }
            }, 85); // Aggiorna la % della riga ogni 85ms
        }

        function showFinalScreen() {
            document.getElementById('log-screen').classList.remove('active');
            document.getElementById('final-screen').classList.add('active');

            // Stampa la coordinata corretta al posto del codice casuale
            document.getElementById('end-code').innerText = finalCoordinate;

            // Timer di reset di 10 minuti
            let timeLeft = 10 * 60; 
            let countdownInterval = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById('timer').innerText = `Reset in: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(countdownInterval);
                    resetPage();
                }
            }, 1000);
        }

        function resetPage() {
            // Ripristina tutte le variabili e l'interfaccia allo stato originale
            document.getElementById('final-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
            
            document.documentElement.style.setProperty('--theme-color', '#0f0'); // Torna verde
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').disabled = false;
            document.getElementById('login-btn').disabled = false;
            document.getElementById('login-message').innerText = '';
            
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').innerText = '0%';
            document.getElementById('countdown-text').innerText = '30:00';
            document.getElementById('log-text').innerHTML = '';
            
            failedAttempts = 0;
            isLocked = false;
            finalCoordinate = "";
        }
    </script>
</body>
</html>
